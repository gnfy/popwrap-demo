<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Popwrap</title>
<meta name="robots" content="noindex, nofollow">
<script>window.BW_BUILD = {"platform":"web","ver":"Popwrap v1.1 · demo, ads are simulated"};</script>
<style>
/* 画面：深靛蓝夜色 + 霓虹粉、青、黄点缀，按钮和面板都有一圈深色粗描边（卡通风）。
   泡泡纸本身由 view.js 用 Phaser 画在 #sheet 的位置上；这里管状态栏、道具、菜单和结算卡。 */
:root{
  --ink:#170f3a; --ink-soft:#6a5aa8; --on-dark-soft:#c9c0ff;
  --bar-top:#6c55e6; --bar-bot:#3e2ca3; --chip-bg:#34268a;
  --pink:#ff5fb8; --pink-deep:#e2479f; --cyan:#4ff0ff; --yellow:#ffd84a; --lime:#8cff5a;
  --card:#f6f1ff; --card-top:#30247f; --card-bot:#1a1350; --card-line:#d9ccff; --field:#ebe4ff; --lilac-top:#ffffff; --lilac-bot:#e2d8ff;
  --gold-body:#ffcf3a; --gold-ink:#c98a00; --accent:#4ff0ff; --overlay:rgba(11,8,32,.74);
  --ratio:.75;
  --f-display:"ZCOOL KuaiLe","Baloo 2","Arial Rounded MT Bold","PingFang SC","Microsoft YaHei",system-ui,sans-serif;
  --f-num:"Baloo 2","Arial Rounded MT Bold",ui-rounded,system-ui,sans-serif;
  --f-body:-apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei","Noto Sans SC",system-ui,sans-serif;
  /* 白字外面描一圈深色边 */
  --outline:0 2px 0 var(--ink),2px 0 0 var(--ink),-2px 0 0 var(--ink),0 -2px 0 var(--ink),1.5px 1.5px 0 var(--ink),-1.5px 1.5px 0 var(--ink),1.5px -1.5px 0 var(--ink),-1.5px -1.5px 0 var(--ink);
  color-scheme:dark;
}
:root[lang^="en"]{--f-display:"Baloo 2","Arial Rounded MT Bold",ui-rounded,system-ui,sans-serif}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%; overscroll-behavior:none}
body{
  margin:0; color:#fff; font:15px/1.5 var(--f-body);
  background-color:#14113a;
  background-image:var(--circuit, linear-gradient(transparent,transparent)),radial-gradient(circle at 100% 0%,rgba(255,95,184,.3),transparent 46%),radial-gradient(circle at 0% 100%,rgba(79,240,255,.2),transparent 46%),linear-gradient(#272f78,#1a1a52 55%,#100c30);
  background-size:384px 384px,auto,auto,auto; background-attachment:fixed;
  padding-left:max(16px,env(safe-area-inset-left,0px)); padding-right:max(16px,env(safe-area-inset-right,0px));
  overflow-x:hidden; -webkit-tap-highlight-color:transparent; -webkit-user-select:none; user-select:none;
}
/* Phaser 的画布：铺满窗口、叠在网页上面、不挡点击 */
#fx{position:fixed; inset:0; z-index:10; pointer-events:none}
#fx canvas{display:block}
/* --pill：平台在左上角盖了自己的按钮时（Poki 手机版），竖屏把整列往下让出这么多 */
.app{max-width:480px; margin:0 auto; min-height:100%; display:flex; flex-direction:column; gap:12px; padding-block:calc(12px + var(--pill, 0px)) 14px}
svg.ic{width:1em; height:1em; fill:none; stroke:currentColor; stroke-width:2.4; stroke-linecap:round; stroke-linejoin:round; flex:none}

/* 状态栏：紫色卡通面板 */
.hud{display:flex; align-items:center; gap:10px; color:#fff; padding:6px 10px 7px; border-radius:24px; border:3.5px solid var(--ink); box-shadow:0 5px 0 var(--ink);
  background:linear-gradient(rgba(255,255,255,.16),rgba(255,255,255,.16)) top/100% 38% no-repeat,linear-gradient(var(--bar-top),var(--bar-bot))}
.hud-btn{appearance:none; border:0; width:38px; height:38px; border-radius:50%; background:rgba(255,255,255,.18); color:inherit; display:grid; place-items:center; font-size:20px; cursor:pointer; flex:none}
.hud-btn:active{transform:scale(.92)}
.hud-title{display:flex; flex-direction:column; align-items:center; line-height:1; min-width:44px; flex:none}
.hud-title small{font:700 10px/1 var(--f-body); letter-spacing:.12em; text-transform:uppercase; color:#d9ccff}
.hud-title b{font:800 26px/1 var(--f-num); margin-top:2px; white-space:nowrap; text-shadow:var(--outline)}
.meter{position:relative; flex:1; min-width:0; height:20px; border-radius:999px; background:#140c3a; box-shadow:inset 0 2px 0 rgba(0,0,0,.35)}
.meter-fill{position:absolute; inset:0 auto 0 0; width:0; border-radius:999px; background:linear-gradient(rgba(255,255,255,.32),rgba(255,255,255,0) 60%),var(--pink); transition:width .25s ease-out}
.meter-mark{position:absolute; top:50%; width:24px; height:24px; margin:-12px 0 0 -12px; display:grid; place-items:center; font-size:22px; line-height:1; color:#2a1f6e; -webkit-text-stroke:1.5px #b8a8ff}
.meter-mark.goal{font-size:17px}
.meter-mark.lit{color:var(--yellow); -webkit-text-stroke:1.5px var(--ink); text-shadow:0 0 8px rgba(255,216,74,.8)}
.meter-mark.flash{animation:starpop .5s ease-out}
.meter-label{position:absolute; inset:0; display:flex; align-items:center; justify-content:flex-start; padding-left:3px; font:800 13px/1 var(--f-num); letter-spacing:.02em; font-variant-numeric:tabular-nums; pointer-events:none}
.meter-label span{background:rgba(23,15,58,.82); color:#fff; border-radius:999px; padding:2px 8px 1px; min-width:28px; text-align:center}
.moves{flex:none; width:50px; height:50px; border-radius:50%; background:#fff; color:var(--ink); display:flex; flex-direction:column; align-items:center; justify-content:center; border:3px solid var(--ink); box-shadow:0 4px 0 var(--ink),inset 0 0 0 3px var(--cyan); line-height:1}
.moves b{font:800 22px/1 var(--f-num); font-variant-numeric:tabular-nums}
.moves small{font:700 9px/1 var(--f-body); color:var(--ink-soft); letter-spacing:.08em; margin-top:1px}
.moves.low{box-shadow:0 4px 0 var(--ink),inset 0 0 0 3px var(--pink)}
.moves.bump{animation:bump .3s ease-out}

/* 目标签这一行 */
.goalbar{display:flex; align-items:center; gap:8px; min-height:42px}
.chip-goal{appearance:none; border:3px solid var(--ink); display:inline-flex; align-items:center; gap:7px; padding:6px 14px 6px 10px; border-radius:999px; background:var(--chip-bg); color:#fff; font:700 14px/1.1 var(--f-body); box-shadow:0 4px 0 var(--ink); cursor:pointer; min-width:0}
.chip-goal .gi{font-size:18px; color:var(--cyan); display:grid; place-items:center}
.chip-goal .gi .coin{width:16px; height:16px; border-radius:50%; background:var(--gold-body); box-shadow:inset 0 0 0 2px var(--ink)}
.chip-goal.ok{color:var(--lime)} .chip-goal.ok .gi{color:var(--lime)}
.chip-goal span:last-child{white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
.chips{display:flex; gap:6px}
.chip{appearance:none; border:2.5px solid transparent; background:transparent; color:var(--on-dark-soft); border-radius:999px; padding:5px 10px; font:700 12px var(--f-body); cursor:pointer}
.chip[aria-pressed="true"]{background:var(--pink); color:#fff; border-color:var(--ink)}
.goalbar .spacer{flex:1}
.round{appearance:none; border:3px solid var(--ink); width:42px; height:42px; border-radius:50%; background:linear-gradient(var(--lilac-top),var(--lilac-bot)); color:var(--ink); display:grid; place-items:center; font-size:19px; box-shadow:0 4px 0 var(--ink); cursor:pointer; flex:none}
.round:active{transform:translateY(3px); box-shadow:0 1px 0 var(--ink)}

/* 泡泡纸的位置：#sheet 是个透明的占位，Phaser 在它上面画泡泡纸，点击也是它收 */
.stage{position:relative; width:min(100%,460px,max(200px,calc((100vh - 260px - var(--pill, 0px)) * var(--ratio)))); margin:0 auto}
.sheet{aspect-ratio:var(--ratio); width:100%; touch-action:none; outline:none}

/* 道具 */
.tools{display:flex; justify-content:center; gap:22px; padding-top:4px}
.tool{appearance:none; border:0; background:none; color:#fff; display:flex; flex-direction:column; align-items:center; gap:7px; cursor:pointer; font:700 12.5px/1 var(--f-body); padding:0; text-shadow:var(--outline)}
.tool-ic{position:relative; width:58px; height:58px; border-radius:50%; background:linear-gradient(var(--lilac-top),var(--lilac-bot)); color:var(--ink); display:grid; place-items:center; font-size:26px; border:3px solid var(--ink); box-shadow:0 5px 0 var(--ink); text-shadow:none}
.tool:active .tool-ic{transform:translateY(4px); box-shadow:0 1px 0 var(--ink)}
.tool-badge{position:absolute; right:-9px; top:-9px; min-width:26px; height:26px; padding:0 5px; border-radius:999px; background:var(--yellow); color:var(--ink); display:grid; place-items:center; font:800 13px/1 var(--f-num); border:2.5px solid var(--ink)}
.tool-badge.vid{background:var(--pink); font-size:13px}
.tool.dim .tool-ic{opacity:.6}
.tools-note{text-align:center; font-size:13px; color:var(--on-dark-soft); padding:14px 0}

/* 提示条 */
.tip{position:fixed; left:50%; bottom:calc(14px + env(safe-area-inset-bottom,0px)); transform:translateX(-50%); width:max-content; max-width:min(92%,360px); background:var(--card); color:var(--ink); border-radius:16px; padding:9px 13px; font-size:13.5px; line-height:1.45; border:3px solid var(--ink); box-shadow:0 5px 0 var(--ink); text-wrap:balance; white-space:pre-line; z-index:12; animation:tipin .3s ease-out; cursor:pointer}
@keyframes tipin{from{opacity:0; transform:translate(-50%,10px)}}

/* 浮在上面的卡片：结算、菜单、选关 */
.overlay{position:fixed; inset:0; z-index:15; background:var(--overlay); display:grid; place-items:center;
  padding:max(16px,env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) max(16px,env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px)); animation:fade .2s ease-out}
.card:focus{outline:none}
.card{width:min(100%,380px); max-height:100%; overflow:auto; background:linear-gradient(180deg,var(--card-top),var(--card-bot)); color:#fff; border-radius:24px; padding:22px 20px 20px; border:4px solid var(--ink); box-shadow:inset 0 0 0 3px var(--card-bot),inset 0 0 0 5px rgba(79,240,255,.75),0 8px 0 var(--ink),0 0 42px rgba(79,240,255,.3); display:flex; flex-direction:column; align-items:center; gap:12px; text-align:center; animation:cardin .32s cubic-bezier(.3,1.5,.5,1); user-select:text; -webkit-user-select:text}
@keyframes fade{from{opacity:0}}
@keyframes cardin{from{transform:translateY(24px) scale(.94); opacity:0}}
.card h2{margin:0; font:400 26px/1.15 var(--f-display); text-wrap:balance; color:#fff; text-shadow:0 3px 0 var(--ink)}
:root[lang^="en"] .card h2{font-weight:800}
.card p{margin:0; color:var(--on-dark-soft); font-size:14px; text-wrap:balance}
.r-stars{display:flex; gap:6px; align-items:flex-end; height:58px}
.r-star{font-size:44px; line-height:1; color:#45379a; -webkit-text-stroke:2.5px var(--ink); transition:color .1s}
.r-star:nth-child(2){font-size:56px}
.r-star.on{color:var(--yellow); filter:drop-shadow(0 0 10px rgba(255,216,74,.65)); animation:stardrop .45s cubic-bezier(.3,1.6,.5,1)}
@keyframes stardrop{0%{transform:translateY(-40px) scale(1.6); opacity:0}100%{transform:none; opacity:1}}
.stamp{border:3px solid var(--ink); background:var(--pink); color:#fff; text-shadow:var(--outline); border-radius:12px; padding:4px 16px; font:400 22px/1.2 var(--f-display); transform:rotate(-8deg); letter-spacing:.06em; box-shadow:0 4px 0 var(--ink),0 0 22px rgba(255,95,184,.75); opacity:0}
:root[lang^="en"] .stamp{font-weight:800; text-transform:uppercase}
.stamp.on{animation:stamp .35s cubic-bezier(.3,1.6,.5,1) forwards}
@keyframes stamp{0%{opacity:0; transform:rotate(-8deg) scale(2.2)}100%{opacity:.95; transform:rotate(-8deg) scale(1)}}
.r-big{font:800 48px/1 var(--f-num); font-variant-numeric:tabular-nums; color:#fff; text-shadow:var(--outline),0 5px 0 #ff3d9a}
.card textarea{width:100%; resize:none; font:500 13px/1.5 var(--f-body); background:var(--field); color:var(--ink); border:2px solid var(--card-line); border-radius:10px; padding:8px 10px; text-align:left}
.r-actions{display:flex; flex-direction:column; align-items:stretch; gap:12px; width:100%; margin-top:4px}
.r-row{display:flex; flex-wrap:wrap; justify-content:center; gap:8px}
.btn{appearance:none; border:3px solid var(--ink); border-radius:14px; padding:10px 16px; background:var(--field); color:var(--ink); font:700 15px/1.15 var(--f-body); box-shadow:0 4px 0 var(--ink); cursor:pointer; display:inline-flex; align-items:center; justify-content:center; gap:6px}
.btn:active{transform:translateY(3px); box-shadow:0 1px 0 var(--ink)}
.btn.primary{background:var(--pink); color:#fff; box-shadow:0 5px 0 var(--ink); font:400 22px/1.1 var(--f-display); padding:13px 20px; border-radius:16px; text-shadow:var(--outline)}
:root[lang^="en"] .btn.primary{font-weight:800; font-size:20px}
.btn.primary:active{box-shadow:0 1px 0 var(--ink); transform:translateY(4px)}
.btn:disabled{opacity:.45; cursor:default; transform:none}
.btn:focus-visible,.round:focus-visible,.tool:focus-visible .tool-ic,.hud-btn:focus-visible,.chip:focus-visible,.chip-goal:focus-visible,.mode-card:focus-visible{outline:3px solid var(--accent); outline-offset:2px}
.levels{display:grid; grid-template-columns:repeat(5,1fr); gap:8px; width:100%}
.levels .btn{flex-direction:column; gap:2px; padding:8px 0; font:800 17px/1 var(--f-num)}
.levels .btn small{font:700 10px/1 var(--f-body); color:var(--gold-ink); letter-spacing:1px; min-height:10px}
.levels .btn.current{background:var(--yellow); color:var(--ink)}
.levels h3{grid-column:1/-1; margin:8px 0 0; font:700 12px var(--f-body); color:var(--on-dark-soft); letter-spacing:.06em; text-align:left}
.modes-list{display:flex; flex-direction:column; gap:12px; width:100%}
.mode-card{appearance:none; border:3px solid var(--ink); display:flex; align-items:center; gap:12px; padding:11px 14px; border-radius:16px; background:var(--field); color:var(--ink); box-shadow:0 4px 0 var(--ink); cursor:pointer; text-align:left}
.mode-card:active{transform:translateY(3px); box-shadow:0 1px 0 var(--ink)}
.mode-card.current{box-shadow:0 4px 0 var(--ink),inset 0 0 0 3px var(--pink)}
.mode-card .mi{width:42px; height:42px; border-radius:12px; background:var(--pink); color:#fff; border:2.5px solid var(--ink); display:grid; place-items:center; font-size:22px; flex:none}
.mode-card b{display:block; font:400 19px/1.1 var(--f-display)}
:root[lang^="en"] .mode-card b{font-weight:800}
.mode-card span{font-size:12.5px; color:var(--ink-soft)}
.settings{display:grid; grid-template-columns:1fr 1fr; gap:10px; width:100%}
.settings .btn{font-size:14px; padding:10px 8px}
.ver{font-size:11px; color:var(--on-dark-soft)}

/* 模拟广告 */
.ad{position:fixed; inset:0; z-index:20; background:var(--overlay); display:grid; place-items:center;
  padding:max(16px,env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) max(16px,env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.ad-card{width:min(100%,320px); background:linear-gradient(180deg,var(--card-top),var(--card-bot)); color:#fff; border:4px solid var(--ink); box-shadow:inset 0 0 0 3px var(--card-bot),inset 0 0 0 5px rgba(79,240,255,.75),0 8px 0 var(--ink); border-radius:20px; padding:20px; display:flex; flex-direction:column; gap:10px; text-align:center}
.ad-count{font:800 64px/1 var(--f-num); color:var(--pink); -webkit-text-stroke:2px var(--ink)}
.ad-track{height:8px; background:var(--ink); border-radius:4px; overflow:hidden}
#ad-bar{height:100%; width:0; background:var(--pink)}
.ad-card p{margin:0; font-size:13px; color:var(--on-dark-soft)}

@keyframes bump{40%{transform:scale(1.18)}}
@keyframes starpop{0%{transform:scale(1)}40%{transform:scale(1.7)}100%{transform:scale(1)}}

/* 横屏（桌面网页平台的 16:9 窗口、手机横放）：左边一栏放状态栏、目标和道具，右边放整张泡泡纸，最矮要撑得住 640x360。
   泡泡纸用绝对定位贴在右边，不参与左栏的行高计算。 */
@media (orientation: landscape) and (min-width: 560px) and (max-height: 820px){
  body{overflow:hidden}
  .app{--W:min(calc((100vh - 20px) * var(--ratio)), calc(100vw - 360px)); position:relative; max-width:none; width:calc(300px + 22px + var(--W)); margin:0 auto; height:100%; min-height:0;
    display:grid; grid-template-columns:300px; grid-template-rows:auto auto auto; align-content:center; row-gap:16px; padding-block:8px; padding-right:calc(var(--W) + 22px)}
  body .stage{position:absolute; right:0; top:50%; transform:translateY(-50%); width:var(--W); margin:0}
  .goalbar{flex-wrap:wrap}
  /* 提示贴在左栏最下面，不盖住泡泡纸，也不把左栏挤得上下跳 */
  .tip{position:absolute; left:0; bottom:8px; width:300px; max-width:none; transform:none; animation:none}
}
@media (orientation: landscape) and (min-width: 560px) and (max-height: 460px){
  .app{row-gap:10px; align-content:start; padding-top:max(14px, calc(4px + var(--pill, 0px)))}
  .tip{font-size:12.5px; line-height:1.4; padding:8px 12px}
  .tool-ic{width:48px; height:48px; font-size:22px}
  .tools{gap:16px}
}
@media (prefers-reduced-motion: reduce){
  .card,.overlay,.tip{animation:none}
}
</style>
</head>
<body>
<div class="app" id="app">
  <header class="hud" id="hud">
    <button class="hud-btn" id="btn-menu" type="button" aria-label="菜单"></button>
    <div class="hud-title"><small id="hud-kicker">关</small><b id="hud-big">1</b></div>
    <div class="meter" id="meter" role="img" aria-label="">
      <div class="meter-fill" id="meter-fill"></div>
      <span class="meter-mark" aria-hidden="true">★</span><span class="meter-mark" aria-hidden="true">★</span><span class="meter-mark" aria-hidden="true">★</span>
      <span class="meter-label"><span id="meter-label">0</span></span>
    </div>
    <div class="moves" id="moves"><b id="moves-n">0</b><small id="moves-cap">步</small></div>
  </header>

  <div class="goalbar">
    <button class="chip-goal" id="goal" type="button"><span class="gi" id="goal-icon" aria-hidden="true"></span><span id="goal-text"></span></button>
    <div class="chips" id="endless-chips" hidden>
      <button class="chip" id="ek-weekly" type="button" aria-pressed="true">本周赛</button>
      <button class="chip" id="ek-free" type="button" aria-pressed="false">随便捏</button>
    </div>
    <span class="spacer"></span>
    <button class="round" id="btn-restart" type="button" aria-label="重来"></button>
  </div>

  <div class="stage" id="stage">
    <div class="sheet" id="sheet" role="img" aria-label="泡泡纸"></div>
  </div>

  <nav class="tools" id="tools">
    <button class="tool" id="btn-hint" type="button"><span class="tool-ic"><span id="ic-hint"></span><span class="tool-badge" id="badge-hint"></span></span><span id="lbl-hint">提示</span></button>
    <button class="tool" id="btn-undo" type="button"><span class="tool-ic"><span id="ic-undo"></span><span class="tool-badge vid" id="badge-undo" aria-hidden="true">🎬</span></span><span id="lbl-undo">撤销</span></button>
    <button class="tool" id="btn-pump" type="button"><span class="tool-ic"><span id="ic-pump"></span><span class="tool-badge vid" id="badge-pump" aria-hidden="true">🎬</span></span><span id="lbl-pump">打气</span></button>
  </nav>
  <p class="tools-note" id="tools-note" hidden></p>
  <div class="tip" id="tip" hidden></div>
</div>

<div class="overlay" id="overlay" hidden><div class="card" id="panel" role="dialog" aria-modal="true"></div></div>

<div class="ad" id="ad" hidden role="dialog" aria-modal="true" aria-label="模拟广告">
  <div class="ad-card">
    <p><span aria-hidden="true">🎬</span> <span id="ad-kind">模拟激励视频</span></p>
    <div class="ad-count" id="ad-count">3</div>
    <div class="ad-track"><div id="ad-bar"></div></div>
    <p id="ad-reason">看完获得奖励</p>
    <p id="ad-note">真实广告约 15–30 秒，这里缩短成 3 秒</p>
  </div>
</div>

<div id="fx" aria-hidden="true"></div>
<script src="engine.js"></script>
<script src="levels.js"></script>
<script src="vendor/phaser.min.js"></script>
<script src="view.js"></script>
<script>
(() => {
  const E = window.BW;
  const LEVELS = window.BW_LEVELS || [];
  const ENDLESS = { start: 10, bonus: 4, chainBonus: 12, goldPress: 1, revive: 3, nearMiss: 3 };
  const LEVEL_REVIVE = 2, FREE_HINTS = 1;
  // 每日一张的三颗星：高手分的 35% / 60% / 85%（原来 50/75/100 太高，大多数人 0 星）

  // 连锁过了 20 个，后面的每一波放慢一点，让大连锁有"慢镜头"的感觉

    const res = { count: 0, gold: 0, direct: r.kind[i] === E.GOLD ? 1 : 0 };

      const st = document.createElement('small'); const n = S.progress[def.id] || 0; st.textContent = n ? '★'.repeat(n) : '';
      b.appendChild(st);
      b.disabled = def.id > open;
      b.setAttribute('aria-label', P.levelAria(def.id, b.disabled, n));
      b.addEventListener('click', () => { startLevel(idx); enterMode('level'); });
      grid.appendChild(b);
    });
    const total = Object.values(S.progress).reduce((a, b) => a + b, 0);
    showPanel({ title: P.pickerTitle, lines: [P.pickerLine(total, LEVELS.length * 3)], extra: grid, actions: [{ label: P.closeBtn, on: closeOverlay }], dismiss: closeOverlay });
    S.panel = 'picker';
    const cur = panelEl.querySelector('.levels .current');
    if (cur && cur.scrollIntoView) cur.scrollIntoView({ block: 'center' });
  }
  // 菜单：换模式、选关、设置都收在这里，游戏画面上只留一个按钮
  function showMenu() {
    if (S.busy || S.ending || S.replaying || S.adPlaying) return;
    stopPlay();
    const wrap = document.createElement('div'); wrap.style.cssText = 'display:flex;flex-direction:column;gap:14px;width:100%';
    const list = document.createElement('div'); list.className = 'modes-list';
    ['level', 'daily', 'endless'].forEach((m, k) => {
      const b = document.createElement('button'); b.type = 'button'; b.className = 'mode-card' + (S.mode === m ? ' current' : '');
      const ic = document.createElement('span'); ic.className = 'mi'; ic.innerHTML = [IC.sheet, IC.calendar, IC.conveyor][k];
      const tx = document.createElement('span'); const bt = document.createElement('b'); bt.textContent = T.modes[k].name;
      const ds = document.createElement('span'); ds.textContent = T.modes[k].desc + (m === 'daily' && streakNow() ? ` · 🔥${T.menu.streak(streakNow())}` : ''); tx.append(bt, ds);
      b.append(ic, tx);
      b.addEventListener('click', () => enterMode(m));
      list.appendChild(b);
    });
    const set = document.createElement('div'); set.className = 'settings';
    const mkBtn = (label, on) => { const b = document.createElement('button'); b.type = 'button'; b.className = 'btn'; b.textContent = label; b.addEventListener('click', () => on(b)); set.appendChild(b); return b; };
    mkBtn(T.menu.levels, () => showLevelPicker());
    mkBtn(T.menu.restart, () => { hidePanel(); restart(); });
    mkBtn(T.menu.sound(S.sound), (b) => { S.sound = !S.sound; store.set('bw.sound', S.sound); SND.setEnabled(S.sound && !S.platformMuted); if (S.sound) ensureAudio(); b.textContent = T.menu.sound(S.sound); });
    mkBtn(T.menu.nums(S.nums), (b) => { S.nums = !S.nums; store.set('bw.nums', S.nums); paint(run()); b.textContent = T.menu.nums(S.nums); });
    const lang = mkBtn(T.menu.lang, () => setLang(S.lang === 'zh' ? 'en' : 'zh'));
    lang.style.gridColumn = '1 / -1';
    const ver = document.createElement('div'); ver.className = 'ver'; ver.textContent = (window.BW_BUILD && window.BW_BUILD.ver) || T.ver;
    wrap.append(list, set, ver);
    showPanel({ title: T.menu.title, extra: wrap, actions: [{ label: T.menu.close, primary: true, on: closeOverlay }], dismiss: closeOverlay });
    S.panel = 'menu';
  }

  // ---------- replay ----------
  // 在一张新的同款纸上把 path 捏一遍给玩家看，放完回到原来的结算面板。
  function replay() { if (S.daily.ref) replayLine(S.daily, S.daily.ref.path, S.daily.total); }
  function replayLine(r, path, presses) {
    if (S.replaying) return;
    hidePanel();
    S.replaying = true; S.hint = -1;
    const view = newRun(r.d, r.startLv, r.startKind, presses);
    const keep = { lv: r.lv, kind: r.kind, mark: r.mark };
    const base = meterModel(r);
    S.replayHud = { k: 0, n: path.length, score: 0, left: presses, meter: { ts: base.ts, at: base.at, marks: base.marks.map(() => ({ lit: false })) } };
    S.shown = 0;
    paint(view); fresh(); updateHUD(true);
    showTip((S.mode === 'daily' ? T.expertReplayNote : T.replayingLevel) + '\n' + T.skipHint);
    // 所有定时器都记在 bag 里：点一下跳过时一次清掉，再回到结算面板
    const bag = [], later = (fn, ms) => bag.push(setTimeout(fn, ms));
    let k = 0, score = 0, finished = false;
    const finish = () => {
      if (finished) return; finished = true;
      bag.forEach(clearTimeout);
      S.replaying = false; S.replayHud = null; S.replayAbort = null; S.hint = -1; tipEl.hidden = true;
      V.cancel(); Object.assign(r, keep); paint(r); updateHUD(true); showResult();
    };
    S.replayAbort = finish;
    const step = () => {
      if (k >= path.length) {
        const spare = presses - k;
        if (!E.alive(view.lv) && spare > 0) {
          score += spare * E.LEFTOVER_POINTS;
          popup(T.pop.early(spare, spare * E.LEFTOVER_POINTS), 'bonus');
          S.replayHud.score = score; updateHUD();
        }
        later(finish, 1400);
        return;
      }
      const i = path[k];
      S.hint = i; paint(view);
      later(() => {
        S.hint = -1; ensureAudio();
        animatePress(view, i, (res) => {
          V.counterEnd();
          score += E.pointsFor(res.count, res.gold);
          popup(T.pop.replay(k + 1, res.count), res.count >= 15 ? 'big' : '', T.pop.total(score));
          if (res.count >= 20) shake(true); else if (res.count >= 10) shake(false);
          k++;
          Object.assign(S.replayHud, { k, score, left: presses - k });
          S.replayHud.meter.marks.forEach((m, j) => { m.lit = score >= S.replayHud.meter.ts[j]; });
          updateHUD();
          later(step, 900);
        }, bag);
      }, 700);
    };
    later(step, 600);
  }
  // 回放中点泡泡纸、点提示条或按 Esc 都算跳过
  const skipReplay = () => { if (S.replaying && S.replayAbort) { S.replayAbort(); return true; } return false; };
  stageEl.addEventListener('click', skipReplay);

  // ---------- controls ----------
  function restart() {
    if (S.busy || S.ending || S.replaying || S.adPlaying) return;
    S.hint = -1;
    const pending = !!run().pumping;
    if (S.mode === 'level') startLevel(S.level.idx);
    else if (S.mode === 'daily') { const watched = S.daily.watchedReplay; startDaily(); S.daily.watchedReplay = watched; }
    else startEndless(S.endlessKind);
    run().pumping = pending;
    enterMode(S.mode);
  }
  function introTip(r) {
    if (S.mode === 'level') return `${T.goal[r.def.goal.type](r.def.goal, r.def.presses)}\n${levelTip(r.def)}`;
    return S.mode === 'daily' ? T.dailyNote : r.free ? T.endlessFree : T.endlessNote(ENDLESS.chainBonus, ENDLESS.bonus);
  }
  function enterMode(m) {
    stopPlay();
    if (m === 'daily' && (!S.daily || S.daily.key !== utcDayKey())) startDaily();
    clearPress(); V.cancel();
    S.mode = m; S.hint = -1;
    store.set('bw.mode', m);
    hidePanel();
    const r = run();
    if (m === 'level') S.hint = guideCell(r);
    S.litKey = '';
    paint(r); fresh(); updateHUD(true);
    if (r.over) { showResult(); return; }
    if (r.used === 0) showTip(introTip(r));
    else tipEl.hidden = true;
  }
  function setEndlessKind(k) {
    if (S.busy || S.ending || S.replaying || S.adPlaying || S.endlessKind === k) return;
    S.endlessKind = k; store.set('bw.ek', k);
    enterMode('endless');
  }
  function setLang(lang) {
    if (S.busy || S.ending || S.replaying || S.adPlaying) return;
    S.lang = lang; T = I18N[lang]; store.set('bw.lang', lang);
    applyStaticText();
    paint(run()); updateHUD(true);
    if (!tipEl.hidden && !run().pumping && !S.replaying) showTip(introTip(run()));
    if (S.panel === 'menu') showMenu();
    else if (S.panel === 'picker') showLevelPicker();
    else if (S.panel === 'result') showResult();
  }
  $('btn-menu').addEventListener('click', showMenu);
  $('btn-restart').addEventListener('click', restart);
  $('goal').addEventListener('click', () => {
    if (S.replaying) return;
    if (!tipEl.hidden) { tipEl.hidden = true; return; }
    showTip(introTip(run()));
  });
  $('ek-weekly').addEventListener('click', () => setEndlessKind('weekly'));
  $('ek-free').addEventListener('click', () => setEndlessKind('free'));
  $('btn-hint').addEventListener('click', () => {
    if (toolsLocked()) return;
    const r = run();
    const apply = () => { hint(); paint(run()); if (S.hint >= 0) popup(T.pop.hinted, 'bonus'); };
    if (r.freeHints > 0) { r.freeHints--; if (S.mode === 'level') S.freeUsed[r.def.id] = true; apply(); syncTools(); } else rewarded(T.ad.hint, apply);
  });
  $('btn-undo').addEventListener('click', () => {
    if (toolsLocked()) return;
    if (!run().history.length) { popup(T.pop.nothingUndo, 'bonus'); return; }
    rewarded(T.ad.undo, undo);
  });
  $('btn-pump').addEventListener('click', () => {
    if (toolsLocked() || run().pumping) return;
    rewarded(T.ad.pump, () => { run().pumping = true; S.hint = -1; paint(run()); showTip(T.pumping); syncTools(); });
  });

  // ---------- boot ----------
  function start(data) {
    data = data || {};
    applyStaticText();
    const saved = store.num('bw.level2', 0);
    startLevel(Math.min(Math.max(0, saved | 0), unlockedUpTo() - 1));
    startEndless('weekly');
    startEndless('free');
    const m = data.mode || store.pick('bw.mode', ['level', 'daily', 'endless'], 'level');
    enterMode(['level', 'daily', 'endless'].includes(m) ? m : 'level');
    try { if (window.claude && window.claude.hot && window.claude.hot.snapshot) window.claude.hot.snapshot(() => ({ mode: S.mode })); } catch (e) {}
  }
  applyStaticText();
  // 先等广告 SDK 初始化（失败或被拦截也照常进游戏），再开局并告诉平台加载完成。
  const boot = (data) => Promise.resolve().then(() => ADS.init()).catch(() => {}).then(() => V.ready).then(() => {
    adoptStorage();
    if (ADS.onPlatformMute) ADS.onPlatformMute((m) => { S.platformMuted = m; SND.setEnabled(S.sound && !m); });
    SND.setEnabled(S.sound && !S.platformMuted);
    start(data); try { ADS.loadingFinished(); } catch (e) {} });
  const hot = window.claude && window.claude.hot;
  if (hot && hot.ready) hot.ready(boot); else boot(hot && hot.data ? hot.data : {});
})();
</script>
</body>
</html>
